[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "BST"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "fastapi>=0.141.1",
    "mcp >= 1.28.1, < 2.0.0",
    "requests>=2.34.2",
    "strands-agents[ollama]>=1.15.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
